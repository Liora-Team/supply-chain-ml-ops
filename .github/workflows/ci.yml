name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync env (core + api + dev, torch-free)
        run: uv sync --frozen

      - name: Lint + format check
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Run tests
        run: uv run pytest
