name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync env (core + api + dev, torch-free)
        run: uv sync --frozen

      - name: Lint + format check
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Configure DVC remote credentials (DagsHub)
        run: |
          uv run dvc remote modify --local dagshub access_key_id "$DAGSHUB_TOKEN"
          uv run dvc remote modify --local dagshub secret_access_key "$DAGSHUB_TOKEN"
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: DVC pull (data + model weights)
        run: uv run dvc pull

      - name: Run tests
        run: uv run pytest
