name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync env (core + api + dev, torch-free)
        run: uv sync --frozen

      - name: Lint + format check
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Configure DVC remote credentials (DagsHub)
        run: |
          uv run dvc remote modify --local dagshub access_key_id "$DAGSHUB_TOKEN"
          uv run dvc remote modify --local dagshub secret_access_key "$DAGSHUB_TOKEN"
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: DVC pull (data + classical model weights)
        run: uv run make pull-ci

      - name: Run tests
        run: uv run pytest

  # The test job never builds an image, so a broken Dockerfile target used to reach dev with
  # CI green (Card 2.4-B review). These two targets are torch-free and build in a few minutes;
  # `bert` is left out on purpose — its torch stack costs ~10 min for little extra coverage.
  # No DVC pull: this checks that the targets build, not that they serve.
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api target (compose default)
        run: docker build --target api .

      - name: Build training target
        run: docker build --target training .
