[project]
name = "supply-chain-mlops"
version = "0.1.0"
description = "MLOps productionization of a Trustpilot review star-rating NLP classifier"
requires-python = ">=3.12"

# Core dependencies — shared by the inference API, the training pipeline, and the tests.
# Deliberately torch-free so the default environment and the API container stay small.
dependencies = [
    "pandas>=2.0",
    "scipy>=1.13",
    # Pinned to the version the committed model pipelines were serialized with, so loading
    # them raises no InconsistentVersionWarning. Phase 2 rebuilds + re-versions artifacts.
    "scikit-learn>=1.8,<1.9",
    "xgboost>=3.2.0",
    "nltk>=3.9.4",
    "joblib>=1.3",
]

# Optional dependency groups (PEP 735). Installed on demand — this is the dependency
# isolation that lets each concern become its own microservice in Phase 2.
[dependency-groups]
# Inference API service (classical models only — no torch).
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Data collection / preprocessing.
data = [
    "datasets>=2.19",
]
# Streamlit front-end + interpretability + EDA visualisation.
app = [
    "streamlit>=1.58.0",
    "plotly>=5.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "wordcloud>=1.9.6",
    "pyldavis>=3.4.1",
    "textblob>=0.20.0",
    "shap>=0.51.0",
    "lime>=0.2.0.1",
]
# DistilBERT path (heavy: torch stack). Opt-in only.
bert = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.9.0",
    "accelerate>=0.30",
]
# Experiment Tracking group (MLflow + dotenv). Opt-in only.
track = [
    "mlflow>=3.14.0",
    "python-dotenv>=1.0.1",
]
# Developer tooling.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=4.6.0",
    "detect-secrets>=1.5.0",
    "dvc[s3]>=3.67.1",
]

[tool.uv]
# `uv sync` (no flags) → core + api + dev: a small, torch-free environment that runs the
# API and the whole test suite. Heavier stacks are opt-in: `uv sync --group app --group bert`.
default-groups = ["api", "dev"]

# arm64-Linux (the bert container built on Apple-silicon) gets CPU-only torch wheels: the
# default PyPI wheels drag the multi-GB nvidia CUDA stack, useless without a GPU. macOS keeps
# PyPI (CPU/MPS built in), and x86_64 Linux keeps the CUDA-capable defaults so a GPU box can
# retrain DistilBERT with this same lockfile.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # External: starlette's TestClient nudges toward httpx2; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
