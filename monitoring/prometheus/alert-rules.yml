groups:
  - name: api-availability
    rules:
      - alert: ApiUnavailable
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Inference API is unavailable
          description: Prometheus has been unable to scrape the API for more than one minute.

  - name: api-performance
    rules:
      - alert: ApiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{handler="/predict"}[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prediction latency is high
          description: The p95 latency for /predict has been above 1 second for 5 minutes.

      - alert: ApiHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{handler="/predict",status=~"5.."}[5m]))
            /
            clamp_min(
              sum(rate(http_requests_total{handler="/predict"}[5m])),
              0.001
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prediction error rate is high
          description: More than 5% of /predict requests have returned 5xx responses for 5 minutes.
  - name: model-drift
    rules:
      - alert: ModelDriftDetected
        expr: drift_detected == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Model input drift detected
          description: Evidently has detected input drift for at least one label schema.
