# Single public entry point for the compose stack (Card 2.4-B).
#   /        -> api:8000    (classical inference API)
#   /mlflow/ -> mlflow:5000 (local tracking UI; server runs with --static-prefix /mlflow)
# TLS terminates here from Card 3.3 (adds the 443 server block + 80 -> 443 redirect).

events {}

http {
    # Round-robins across replicas when the api is scaled
    # (`docker compose up --scale api=N`). Docker DNS returns one A record per
    # replica; nginx resolves them at startup — restart the proxy after scaling.
    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /mlflow/ {
            proxy_pass http://mlflow:5000;
        }

        location / {
            proxy_pass http://api_upstream;
        }
    }
}
