# Single public entry point for the compose stack (Card 2.4-B).
#   /        -> api:8000    (classical inference API)
#   /mlflow/ -> mlflow:5000 (local tracking UI; server runs with --static-prefix /mlflow)
# TLS terminates here from Card 3.3 (adds the 443 server block + 80 -> 443 redirect).

events {}

http {
    # Round-robins across replicas when the api is scaled
    # (`docker compose up --scale api=N`). Docker DNS returns one A record per
    # replica; nginx resolves them at startup — restart the proxy after scaling.
    upstream api_upstream {
        server api:8000;
    }

    # HTTP -> HTTPS
    server {
        listen 80;

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without this, /mlflow (no trailing slash) misses the block below, falls through
        # to location / and 404s at the api.
        location = /mlflow {
            return 301 /mlflow/;
        }

        location /mlflow/ {
            proxy_pass http://mlflow:5000;
        }

        # Prometheus metrics are unauthenticated and meant for the internal network
        # only (Card 4.2 scrapes api:8000 directly) — never expose them publicly.
        location = /metrics {
            return 403;
        }

        location / {
            proxy_pass http://api_upstream;
        }
    }
}
