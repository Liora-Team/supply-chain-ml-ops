# One container per responsibility (Card 2.4-B). Services address each other by
# service name over the compose network — never localhost.
# Profiles keep heavy paths opt-in: `--profile train` / `--profile bert`.
services:
  api:
    build:
      context: .
      target: api
    image: supply-chain-mlops-api:latest
    # No container_name: lets `docker compose up --scale api=N` run replicas.
    ports:
      - "8000:8000"
    environment:
      # Point these at an HF hub id or mounted path to enable the DistilBERT path (Phase 2).
      DISTILBERT_3CLASS: "${DISTILBERT_3CLASS:-}"
      DISTILBERT_5CLASS: "${DISTILBERT_5CLASS:-}"
      # Card 2.2 registry load: tracking credentials pass through at runtime, never baked in.
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-}"
      MLFLOW_TRACKING_USERNAME: "${MLFLOW_TRACKING_USERNAME:-}"
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  # One-shot training job — `docker compose --profile train up training`.
  # Rebuilds the served pipelines; a plain `docker compose up` never retrains.
  training:
    profiles: ["train"]
    build:
      context: .
      target: training
    image: supply-chain-mlops-training:latest
    container_name: sc-mlops-training
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      # Team truth is DagsHub (.env); for offline local dev set
      # MLFLOW_TRACKING_URI=http://mlflow:5000 to log into the local mlflow service.
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-}"
      MLFLOW_TRACKING_USERNAME: "${MLFLOW_TRACKING_USERNAME:-}"
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:-}"
    restart: "no"

  # Local MLflow tracking UI for offline dev only — team truth lives on DagsHub.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: sc-mlops-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns/artifacts
    volumes:
      - mlruns:/mlruns
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # DistilBERT as its own torch-only service — `docker compose --profile bert up bert`.
  # Keeps the classical api image slim; weights resolve via DISTILBERT_* (CONTRIBUTING.md §7).
  bert:
    profiles: ["bert"]
    build:
      context: .
      target: bert
    image: supply-chain-mlops-bert:latest
    container_name: sc-mlops-bert
    volumes:
      # DVC-restored weights (models/distilbert_{3,5}class/final/, Card 2.3) reach the
      # container through this mount.
      - ./models:/app/models
    environment:
      DISTILBERT_3CLASS: "${DISTILBERT_3CLASS:-}"
      DISTILBERT_5CLASS: "${DISTILBERT_5CLASS:-}"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-}"
      MLFLOW_TRACKING_USERNAME: "${MLFLOW_TRACKING_USERNAME:-}"
      MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

volumes:
  mlruns:
